<!-- Open Graph & Social Media Preview Meta Tags -->
<meta property="og:title" content="{{ if .Title }}{{ .Title }} | {{ .Site.Title }}{{ else }}{{ .Site.Title }}{{ end }}" />
<meta property="og:description" content="{{ .Description | default .Summary | default .Site.Params.description }}" />
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
<meta property="og:url" content="{{ .Permalink }}" />

{{ if .Params.images }}
  {{ range first 1 .Params.images }}
    {{ $imgUrl := . | absURL }}
    {{ with $.Resources.GetMatch . }}
      {{ $imgUrl = .Permalink }}
    {{ end }}
    <meta property="og:image" content="{{ $imgUrl }}" />
    <meta property="og:image:secure_url" content="{{ $imgUrl }}" />
    <meta name="twitter:image" content="{{ $imgUrl }}" />
  {{ end }}
{{ else if .Site.Params.avatarURL }}
  {{ $avatarUrl := .Site.Params.avatarURL | absURL }}
  <meta property="og:image" content="{{ $avatarUrl }}" />
  <meta property="og:image:secure_url" content="{{ $avatarUrl }}" />
  <meta name="twitter:image" content="{{ $avatarUrl }}" />
{{ end }}

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ .Title | default .Site.Title }}" />
<meta name="twitter:description" content="{{ .Description | default .Summary | default .Site.Params.description }}" />

<style>
figure {
  margin: 1.5rem auto;
  text-align: center;
}
figure img {
  max-width: 100%;
  height: auto;
  margin: 0 auto;
  display: block;
  border-radius: 4px;
}
figcaption {
  margin-top: 0.5rem;
  font-size: 0.88rem;
  opacity: 0.8;
  font-style: italic;
  text-align: center;
}
</style>
